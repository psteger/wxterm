version: 2

project_name: wxterm

before:
  hooks:
    - go mod tidy
    - env WXTERM_VERSION={{ .Version }} ./wasm/build.sh wasm/dist
    - tar -czf wasm/dist/wxterm_{{ .Version }}_wasm.tar.gz -C wasm/dist wxterm.wasm wasm_exec.js

builds:
  - main: .
    binary: wxterm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: "wasm/dist/wxterm_{{ .Version }}_wasm.tar.gz"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: wxterm
  draft: false
  prerelease: auto
  extra_files:
    - glob: "wasm/dist/wxterm_{{ .Version }}_wasm.tar.gz"
